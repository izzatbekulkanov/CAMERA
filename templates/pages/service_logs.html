{% extends 'base/base.html' %}
{% load static %}

{% block styles %}
<style>
    /* ===== Layout tweaks ===== */
    .service-box {
        max-height: 70vh;
        overflow-y: auto;
    }
    .service-btn.active {
        background: #0d6efd !important;
        color: white !important;
        font-weight: 600;
    }
    .service-btn:hover {
        background: rgba(13,110,253,0.1);
    }

    /* ===== Log viewer ===== */
    #log-box {
        background: #0b0f14;
        color: #c5f7c5;
        border-radius: 12px;
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        line-height: 1.55;
        padding: 12px;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
    }
    #log-box div {
        white-space: pre-wrap;
        word-break: break-word;
    }

    /* ===== Action buttons ===== */
    .action-btn {
        border-radius: 10px;
        font-weight: 600;
        padding: 6px 12px;
        display: flex;
        align-items: center;
        gap: 6px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.05);
        transition: 0.2s ease;
        border: none;
    }
    .action-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 18px rgba(0,0,0,0.08);
    }

    .btn-soft-success {
        background: rgba(25,135,84,0.12);
        color: #198754;
        border: 1px solid rgba(25,135,84,0.2);
    }
    .btn-soft-danger {
        background: rgba(220,53,69,0.12);
        color: #dc3545;
        border: 1px solid rgba(220,53,69,0.2);
    }
    .btn-soft-warning {
        background: rgba(255,193,7,0.15);
        color: #d39e00;
        border: 1px solid rgba(255,193,7,0.25);
    }
    .btn-soft-primary {
        background: rgba(13,110,253,0.12);
        color: #0d6efd;
        border: 1px solid rgba(13,110,253,0.2);
    }
    .btn-soft-gray {
        background: rgba(108,117,125,0.12);
        color: #6c757d;
        border: 1px solid rgba(108,117,125,0.2);
    }

    /* ===== Header row ===== */
    .log-header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
    }
    .log-header-title {
        font-size: 15px;
        font-weight: 700;
        color: #1f2937;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    /* Service search */
    #service-search {
        border-radius: 12px;
        font-size: 13px;
        padding: 8px 12px;
    }

    /* Modal textarea */
    #unit-file-textarea {
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        background: #0b0f14;
        color: #d1e7dd;
        border-radius: 10px;
        padding: 10px;
        border: 1px solid rgba(255,255,255,0.08);
        width: 100%;
        height: 55vh;
        resize: vertical;
    }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid">
    {% include 'includes/breadcrumbs.html' %}

    <div class="row g-3">

        <!-- LEFT SIDE -->
        <div class="col-md-3">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-header bg-white border-0 fw-bold d-flex justify-content-between align-items-center">
                    <span><i class="mdi mdi-server-network me-1"></i> Servislar</span>
                    <span class="badge bg-primary">{{ services|length }}</span>
                </div>

                <div class="card-body pt-0">
                    <input type="text" id="service-search" class="form-control form-control-sm mb-3"
                           placeholder="Service qidirish...">
                </div>

                <div class="list-group list-group-flush service-box" id="service-list">
                    {% for s in services %}
                        <button class="list-group-item list-group-item-action service-btn text-start"
                                data-service="{{ s }}">
                            <i class="mdi mdi-cog-outline me-1 text-muted"></i> {{ s }}
                        </button>
                    {% endfor %}
                </div>
            </div>
        </div>

        <!-- RIGHT SIDE -->
        <div class="col-md-9">
            <div class="card shadow-sm border-0 rounded-4">

                <!-- HEADER -->
                <div class="card-header bg-white border-0 log-header">
                    <div class="log-header-title">
                        <i class="mdi mdi-console"></i>
                        <span id="active-service">Servis tanlang...</span>
                    </div>

                    <div class="d-flex gap-2 flex-wrap">

                        <button class="action-btn btn-soft-gray" id="btn-edit-unit" disabled>
                            <i class="mdi mdi-pencil-outline"></i> Edit
                        </button>

                        <button class="action-btn btn-soft-success" onclick="runAction('start')" disabled id="btn-start">
                            <i class="mdi mdi-play-circle-outline"></i> Start
                        </button>

                        <button class="action-btn btn-soft-warning" onclick="runAction('restart')" disabled id="btn-restart">
                            <i class="mdi mdi-restart"></i> Restart
                        </button>

                        <button class="action-btn btn-soft-danger" onclick="runAction('stop')" disabled id="btn-stop">
                            <i class="mdi mdi-stop-circle-outline"></i> Stop
                        </button>

                        <button class="action-btn btn-soft-primary" onclick="runAction('enable')" disabled id="btn-enable">
                            <i class="mdi mdi-check-circle-outline"></i> Enable
                        </button>

                        <button class="action-btn btn-soft-gray" onclick="runAction('disable')" disabled id="btn-disable">
                            <i class="mdi mdi-close-circle-outline"></i> Disable
                        </button>
                    </div>
                </div>

                <!-- LOG BOX -->
                <div class="card-body">
                    <div id="log-box" style="height:70vh; overflow:auto;">
                        <div class="text-muted">Loglar shu yerda chiqadi...</div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- =================== EDIT MODAL =================== -->
<div class="modal fade" id="unitModal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content border-0 rounded-4">
      <div class="modal-header bg-light">
        <h5 class="modal-title fw-bold">
            <i class="mdi mdi-file-document-edit-outline me-1"></i>
            <span id="unitModalTitle">Service Unit</span>
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
          <textarea id="unit-file-textarea"></textarea>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">
            <i class="mdi mdi-close"></i> Bekor qilish
        </button>

        <button type="button" class="btn btn-success" id="btn-save-unit">
            <i class="mdi mdi-content-save-outline"></i> Saqlash
        </button>
      </div>
    </div>
  </div>
</div>

<script src="{% static 'assets/js/vendor.min.js' %}"></script>
<script src="{% static 'assets/js/app.min.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- ✅ SWEETALERT2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
let ws = null;
let currentService = null;

const btnStart   = document.getElementById("btn-start");
const btnStop    = document.getElementById("btn-stop");
const btnRestart = document.getElementById("btn-restart");
const btnEnable  = document.getElementById("btn-enable");
const btnDisable = document.getElementById("btn-disable");
const btnEdit    = document.getElementById("btn-edit-unit");

const unitModal = new bootstrap.Modal(document.getElementById("unitModal"));
const unitModalTitle = document.getElementById("unitModalTitle");
const unitTextarea = document.getElementById("unit-file-textarea");
const btnSaveUnit = document.getElementById("btn-save-unit");

// ✅ Swal toast helper
function showToast(success, message) {
    Swal.fire({
        icon: success ? "success" : "error",
        title: success ? "Bajarildi" : "Xatolik",
        text: message,
        timer: 2500,
        showConfirmButton: false,
        toast: true,
        position: "top-end"
    });
}

// ✅ Confirmation modal
function confirmAction(action, serviceName) {
    return Swal.fire({
        icon: "question",
        title: "Tasdiqlaysizmi?",
        text: `${serviceName} uchun "${action.toUpperCase()}" amalini bajarish?`,
        showCancelButton: true,
        confirmButtonText: "Ha, bajar!",
        cancelButtonText: "Bekor qilish",
        confirmButtonColor: "#0d6efd"
    });
}

// ================= SEARCH FILTER =================
document.getElementById("service-search").addEventListener("input", function () {
    const query = this.value.toLowerCase();
    document.querySelectorAll(".service-btn").forEach(btn => {
        const name = btn.dataset.service.toLowerCase();
        btn.style.display = name.includes(query) ? "" : "none";
    });
});

// ================= CONNECT LOGS =================
function connectLogs(serviceName) {
    currentService = serviceName;
    document.getElementById("active-service").textContent = serviceName;

    [btnStart, btnStop, btnRestart, btnEnable, btnDisable, btnEdit].forEach(b => b.disabled = false);

    const logBox = document.getElementById("log-box");
    logBox.innerHTML = "";

    document.querySelectorAll(".service-btn").forEach(b => b.classList.remove("active"));
    const activeBtn = document.querySelector(`.service-btn[data-service="${serviceName}"]`);
    if (activeBtn) activeBtn.classList.add("active");

    if (ws) {
        ws.close();
        ws = null;
    }

    const wsUrl = `${location.protocol === "https:" ? "wss://" : "ws://"}${location.host}/ws/logs/${serviceName}/`;
    ws = new WebSocket(wsUrl);

    ws.onmessage = function (event) {
        const data = JSON.parse(event.data);
        if (data.line) {
            const div = document.createElement("div");
            div.textContent = data.line;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }
    };

    ws.onerror = function () {
        const div = document.createElement("div");
        div.textContent = "WS error";
        div.style.color = "#ff6666";
        logBox.appendChild(div);
    };

    ws.onclose = function () {
        const div = document.createElement("div");
        div.textContent = "Ulanish yopildi (reconnect mumkin)";
        div.style.color = "#ffc107";
        logBox.appendChild(div);
    };
}

document.querySelectorAll(".service-btn").forEach(btn => {
    btn.addEventListener("click", () => connectLogs(btn.dataset.service));
});

// ================= RUN ACTION =================
function runAction(action) {
    if (!currentService) {
        showToast(false, "Avval servis tanlang!");
        return;
    }

    confirmAction(action, currentService).then(result => {
        if (!result.isConfirmed) return;

        Swal.fire({
            title: "Bajarilmoqda...",
            text: "Iltimos kuting",
            allowOutsideClick: false,
            didOpen: () => Swal.showLoading()
        });

        fetch("{% url 'service_action' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": "{{ csrf_token }}"
            },
            body: JSON.stringify({service: currentService, action: action})
        })
        .then(r => r.json())
        .then(res => {
            Swal.close();
            showToast(res.success, res.message);
        })
        .catch(err => {
            Swal.close();
            showToast(false, "Ulanish xatosi!");
            console.error(err);
        });
    });
}

// ================= EDIT UNIT FILE =================
btnEdit.addEventListener("click", () => {
    if (!currentService) return;

    unitModalTitle.textContent = currentService + " unit file";
    unitTextarea.value = "Yuklanmoqda...";

    fetch("{% url 'service_unit_load' %}?service=" + encodeURIComponent(currentService))
        .then(r => r.json())
        .then(res => {
            if(res.success){
                unitTextarea.value = res.content;
                unitModal.show();
            }else{
                showToast(false, res.message);
            }
        })
        .catch(err => {
            showToast(false, "Unit file yuklashda xatolik!");
            console.error(err);
        });
});

// ================= SAVE UNIT FILE =================
btnSaveUnit.addEventListener("click", () => {
    if (!currentService) return;

    Swal.fire({
        title: "Saqlanmoqda...",
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
    });

    fetch("{% url 'service_unit_save' %}", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": "{{ csrf_token }}"
        },
        body: JSON.stringify({
            service: currentService,
            content: unitTextarea.value
        })
    })
    .then(r => r.json())
    .then(res => {
        Swal.close();
        showToast(res.success, res.message);
        if(res.success){
            unitModal.hide();
        }
    })
    .catch(err => {
        Swal.close();
        showToast(false, "Saqlashda xatolik!");
        console.error(err);
    });
});
</script>

{% endblock %}
