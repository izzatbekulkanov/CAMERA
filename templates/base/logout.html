{% load static i18n %}
<!DOCTYPE html>
<html lang="uz" data-layout="horizontal" data-topbar-color="dark">
<head>
    <meta charset="utf-8" />
    <title>Chiqish | Aqilli Darvoza (SmartGate)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Aqilli Darvoza — Namangan davlat pedagogika instituti intellektual biometrik davomat va monitoring tizimi" name="description" />
    <meta content="SmartGate" name="author" />

    <!-- App favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'assets/images/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'assets/images/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'assets/images/favicon-16x16.png' %}">
    <link rel="shortcut icon" href="{% static 'assets/images/favicon.ico' %}">
    <link rel="manifest" href="{% static 'assets/images/site.webmanifest' %}">

    <!-- Theme Config Js -->
    <script src="{% static 'assets/js/head.js' %}"></script>

    <!-- Bootstrap css -->
    <link href="{% static 'assets/css/bootstrap.min.css' %}" rel="stylesheet" type="text/css" id="app-style" />

    <!-- App css -->
    <link href="{% static 'assets/css/app.min.css' %}" rel="stylesheet" type="text/css" />

    <!-- Icons css -->
    <link href="{% static 'assets/css/icons.min.css' %}" rel="stylesheet" type="text/css" />

    <style>
        .brand-logo-img {
            height: 36px;
            width: 36px;
            border-radius: 9px;
            object-fit: contain;
            box-shadow: 0 3px 8px rgba(80, 64, 251, 0.35);
        }
        .brand-text {
            font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
            white-space: nowrap;
            user-select: none;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .brand-text .brand-title {
            color: #1e293b;
            font-weight: 700;
        }
        .brand-text .brand-highlight {
            color: #556ee6;
            font-weight: 700;
        }
        .btn-primary {
            background-color: #6658dd;
            border-color: #6658dd;
        }
        .btn-primary:hover {
            background-color: #5b4ecd;
            border-color: #5b4ecd;
        }
        .logout-checkmark {
            width: 86px;
            margin: 0 auto 15px auto;
        }
        .logout-checkmark .path {
            stroke-dasharray: 1000;
            stroke-dashoffset: 0;
            animation: dash 2s ease-in-out;
        }
        .logout-checkmark .spin {
            animation: spin 2s;
            transform-origin: 50% 50%;
        }
        @keyframes dash {
            0% { stroke-dashoffset: 1000; }
            100% { stroke-dashoffset: 0; }
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body class="authentication-bg authentication-bg-pattern">

    <div class="account-pages mt-5 mb-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6 col-xl-4">
                    <div class="card bg-pattern shadow-lg border-0 rounded-3">

                        <div class="card-body p-4">

                            <!-- Brand Header -->
                            <div class="text-center w-100 m-auto">
                                <div class="auth-brand mb-3">
                                    <a href="/" class="d-inline-flex align-items-center gap-2 text-decoration-none">
                                        <img src="{% static 'assets/images/apple-touch-icon.png' %}" class="brand-logo-img" alt="Aqlli Darvoza">
                                        <span class="brand-text">
                                            <span class="brand-title">Aqlli</span>
                                            <span class="brand-highlight">Darvoza</span>
                                        </span>
                                    </a>
                                </div>
                            </div>

                            <div class="text-center">
                                <div class="mt-2 mb-3">
                                    <div class="logout-checkmark">
                                        <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130.2 130.2">
                                            <circle class="path circle" fill="none" stroke="#4bd396" stroke-width="6" stroke-miterlimit="10" cx="65.1" cy="65.1" r="62.1"/>
                                            <polyline class="path check" fill="none" stroke="#4bd396" stroke-width="6" stroke-linecap="round" stroke-miterlimit="10" points="100.2,40.2 51.5,88.8 29.8,67.5 "/>
                                        </svg>
                                    </div>
                                </div>

                                <h4 class="fw-bold text-dark mb-1">Xayr, salomat bo'ling!</h4>
                                <p class="text-muted font-size-13 mb-4">Siz tizimdan muvaffaqiyatli chiqdingiz.</p>

                                <div class="d-grid">
                                    <a href="{% url 'login' %}" class="btn btn-primary btn-lg font-size-15 fw-semibold shadow-sm">
                                        <i class="mdi mdi-login me-1"></i> Qaytadan Kirish
                                    </a>
                                </div>
                            </div>

                        </div> <!-- end card-body -->
                    </div>
                    <!-- end card -->

                    <div class="row mt-3">
                        <div class="col-12 text-center">
                            <p class="text-white-50 font-size-13 mb-0">
                                NamDPI Aqilli Darvoza &copy; <script>document.write(new Date().getFullYear())</script> — Biometrik Monitoring Tizimi
                            </p>
                        </div>
                    </div>

                </div> <!-- end col -->
            </div>
            <!-- end row -->
        </div>
        <!-- end container -->
    </div>
    <!-- end page -->

    <footer class="footer footer-alt">
        <script>document.write(new Date().getFullYear())</script> &copy; SmartGate by NamSPI
    </footer>

    <!-- Vendor & Auth JS -->
    <script src="{% static 'assets/js/vendor.min.js' %}"></script>
    <script src="{% static 'assets/js/app.min.js' %}"></script>
</body>
</html>
