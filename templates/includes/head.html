{% load static %}
<meta charset="utf-8"/>


<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description"
      content="Attendance & User Management System — boshqaruv paneli orqali foydalanuvchilar, tashriflar va hisobotlarni kuzatish imkoniyati.">
<meta name="author" content="Izzatbek Ulkanov">
<meta name="keywords" content="Django, Admin Panel, Attendance, Users, Dashboard, Management System">

<!-- Favicon -->
{% if global_site_settings and global_site_settings.logo_small %}
    <link rel="icon" href="{{ global_site_settings.logo_small.url }}" type="image/png">
{% else %}
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'assets/images/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'assets/images/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'assets/images/favicon-16x16.png' %}">
    <link rel="shortcut icon" href="{% static 'assets/images/favicon.ico' %}">
    <link rel="manifest" href="{% static 'assets/images/site.webmanifest' %}">
{% endif %}
<!-- Styles -->
{% include 'includes/styles.html' %}
